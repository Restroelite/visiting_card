/* ── QR Code (real, scannable — SVG output for crisp print/export) ── */
function QRCodeSVG({ url, size = 72, fgColor = "#000", bgColor = "white", centerLogo = null }) {
  const qr = React.useMemo(() => {
    if (!url) return null;
    const encoded = qrcode(0, centerLogo ? 'H' : 'M');
    encoded.addData(url);
    encoded.make();
    return encoded;
  }, [url, centerLogo]);

  const moduleCount = qr ? qr.getModuleCount() : 0;
  const cells = [];
  if (qr) {
    for (let row = 0; row < moduleCount; row += 1) {
      for (let col = 0; col < moduleCount; col += 1) {
        if (qr.isDark(row, col)) {
          cells.push(<rect key={`${row}-${col}`} x={col} y={row} width="1" height="1" />);
        }
      }
    }
  }

  const logoSize = Math.round(size * 0.26);
  const logoOffset = Math.round((size - logoSize) / 2);

  return (
    <div style={{ position: 'relative', width: size, height: size, flexShrink: 0, overflow: 'hidden' }}>
      {qr && (
        <svg
          width={size}
          height={size}
          viewBox={`0 0 ${moduleCount} ${moduleCount}`}
          xmlns="http://www.w3.org/2000/svg"
          shapeRendering="crispEdges"
          style={{ display: 'block' }}
        >
          <rect width={moduleCount} height={moduleCount} fill={bgColor === 'transparent' ? '#ffffff' : bgColor} />
          <g fill={fgColor}>{cells}</g>
        </svg>
      )}
      {centerLogo && (
        <div style={{
          position: 'absolute', left: logoOffset, top: logoOffset,
          width: logoSize, height: logoSize,
          background: 'white', borderRadius: 100, padding: 1,
          display: 'flex', alignItems: 'center', justifyContent: 'center',
          pointerEvents: 'none',
        }}>
          <img src={centerLogo} style={{ width: '100%', height: '100%', objectFit: 'contain' }} />
        </div>
      )}
    </div>
  );
}

/* ── Food photo placeholder (rich pasta/food scene) ── */
function FoodPhoto({ width, height }) {
  return (
    <svg width={width} height={height} viewBox={`0 0 ${width} ${height}`} xmlns="http://www.w3.org/2000/svg">
      <defs>
        <radialGradient id="food-bg" cx="60%" cy="40%" r="70%">
          <stop offset="0%" stopColor="#8B4513"/>
          <stop offset="40%" stopColor="#654321"/>
          <stop offset="100%" stopColor="#3d1a0a"/>
        </radialGradient>
        <radialGradient id="plate" cx="50%" cy="50%" r="50%">
          <stop offset="0%" stopColor="#f0e8d0"/>
          <stop offset="100%" stopColor="#d4c4a0"/>
        </radialGradient>
        <radialGradient id="sauce" cx="50%" cy="50%" r="50%">
          <stop offset="0%" stopColor="#cc3300"/>
          <stop offset="100%" stopColor="#991100"/>
        </radialGradient>
      </defs>
      {/* background */}
      <rect width={width} height={height} fill="url(#food-bg)"/>
      {/* dark texture blobs */}
      <ellipse cx={width*0.7} cy={height*0.2} rx={width*0.3} ry={height*0.25} fill="#2a1005" opacity="0.6"/>
      <ellipse cx={width*0.1} cy={height*0.8} rx={width*0.25} ry={height*0.2} fill="#1a0a02" opacity="0.5"/>
      {/* plate */}
      <ellipse cx={width*0.45} cy={height*0.55} rx={width*0.38} ry={height*0.32} fill="url(#plate)" opacity="0.9"/>
      {/* pasta swirls */}
      {[0,20,40,60,80,100].map(offset => (
        <path key={offset} d={`M${width*0.2+offset*0.3} ${height*0.5} q${width*0.08} -${height*0.12} ${width*0.14} 0 q${width*0.06} ${height*0.1} ${width*0.12} 0`}
          stroke="#c8a060" strokeWidth="3" fill="none" opacity="0.7" transform={`translate(${-offset*0.5},${offset*0.2})`}/>
      ))}
      {/* sauce */}
      <ellipse cx={width*0.45} cy={height*0.48} rx={width*0.18} ry={height*0.14} fill="url(#sauce)" opacity="0.85"/>
      {/* tomato hint */}
      <circle cx={width*0.72} cy={height*0.18} r={height*0.14} fill="#cc2200" opacity="0.8"/>
      <circle cx={width*0.72} cy={height*0.18} r={height*0.1} fill="#dd3311" opacity="0.9"/>
      {/* green herbs */}
      <ellipse cx={width*0.38} cy={height*0.42} rx={5} ry={3} fill="#3a7a2a" opacity="0.9" transform={`rotate(-20,${width*0.38},${height*0.42})`}/>
      <ellipse cx={width*0.52} cy={height*0.45} rx={4} ry={2.5} fill="#2d6020" opacity="0.9" transform={`rotate(15,${width*0.52},${height*0.45})`}/>
      <ellipse cx={width*0.44} cy={height*0.53} rx={5} ry={2} fill="#3a7a2a" opacity="0.9" transform={`rotate(-10,${width*0.44},${height*0.53})`}/>
      {/* overlay gradient to blend with card */}
      <rect width={width} height={height} fill="url(#food-fade)" opacity="0.3"/>
    </svg>
  );
}

          <div style={{display:'flex', alignItems:'center', gap:8}}>
            <WebIcon color={red} size={14}/>
            <div style={{display:'flex', flexDirection:'column', gap:0}}>
              <span style={{fontFamily:"'Open Sans',sans-serif", fontSize:8.5, color:'#1a1a1a', fontWeight:600}}>{contact.website}</span>
              <span style={{fontFamily:"'Open Sans',sans-serif", fontSize:8, color:'rgba(0,0,0,0.55)'}}>{contact.address}</span>

          <div style={{display:'flex', alignItems:'center', gap:8}}>
            <LocationIcon color={red} size={14}/>
            <span style={{fontFamily:"'Open Sans',sans-serif", fontSize:8.5, color:'#1a1a1a', fontWeight:600}}>{contact.address}</span>
          </div>
        </div>
      </div>

      {/* ── QR code ── */}
      <div style={{
        position:'absolute', zIndex:5,
        right:12, bottom:12,
        background:'rgba(255,255,255,0.95)',
        borderRadius:6,
        padding:4,
        boxShadow:'0 2px 10px rgba(0,0,0,0.35)',
      }}>
        <QRCodeSVG url={activeQrUrl} size={54} fgColor="#1a1a1a" bgColor="white" centerLogo="assets/google-logo.png"/>
      </div>

      {/* ── Restroelite badge — amber bg matching card ── */}
      <div style={{
        position:'absolute', zIndex:5, top:11, right:11,
        display:'flex', alignItems:'center', gap:4,
        background:'#e09400',
        borderRadius:20,
        padding:'3px 8px',
        boxShadow:'0 1px 4px rgba(0,0,0,0.2)',
      }}>
        <div style={{
          width:13, height:13,
          display:'flex', alignItems:'center', justifyContent:'center',
        }}>
          <img src="assets/logo-white-trans.png" style={{width:'100%', height:'100%', objectFit:'contain'}} />
        </div>
        <span style={{fontFamily:"'Montserrat',sans-serif", fontSize:6.5, fontWeight:700, color:'#1a1a1a', letterSpacing:'0.08em', textTransform:'uppercase'}}>{brand.badge.label}</span>
      </div>
    </div>
  );
}

/* ══════════════════════════════════════════════
   MAIN APP
══════════════════════════════════════════════ */
function setByPath(source, path, value) {
  const keys = path.split('.');
  const next = Array.isArray(source) ? [...source] : { ...source };
  let current = next;

  for (let index = 0; index < keys.length - 1; index += 1) {
    const key = keys[index];
    current[key] = Array.isArray(current[key]) ? [...current[key]] : { ...current[key] };
    current = current[key];
  }

  current[keys[keys.length - 1]] = value;
  return next;
}

function EditorField({ label, value, onChange, multiline = false }) {
  const sharedProps = {
    className: multiline ? 'editor-textarea' : 'editor-input',
    value: value ?? '',
    onChange: (event) => onChange(event.target.value),
  };

  return (
    <div className="editor-field">
      <label className="editor-label">{label}</label>
      {multiline ? <textarea {...sharedProps} /> : <input {...sharedProps} />}
    </div>
  );
}

function EditorPanel({ content, onChange, onReset, onPhotoUpload, uploadedPhotoName }) {
  const fields = [
    {
      title: 'Page',
      items: [
        ['Browser Title', 'page.title'],
        ['Canvas Title', 'page.canvasTitle'],
      ],
    },
    {
      title: 'Brand',
      items: [
        ['Name', 'brand.name'],
        ['Name Suffix', 'brand.nameSuffix'],
        ['Full Name', 'brand.fullName'],
        ['Full Name Sub', 'brand.fullNameSub'],
        ['Tagline', 'brand.tagline'],
        ['Category', 'brand.category'],
        ['Badge Label', 'brand.badge.label'],
      ],
    },
    {
      title: 'Contact',
      items: [
        ['Phone', 'contact.phone'],
        ['Email', 'contact.email'],
        ['Website', 'contact.website'],
        ['Address', 'contact.address'],
      ],
    },
    {
      title: 'QR',
      items: [
        ['QR URL', 'qr.url'],
      ],
    },
  ];

  const readValue = (path) => path.split('.').reduce((acc, key) => acc?.[key], content) ?? '';

  return (
    <aside className="editor-pane">
      <div className="editor-scroll">
        <div className="editor-kicker">Live Content Editor</div>
        <div className="editor-title">Edit the default card data in the browser</div>
        <div className="editor-copy">
          The values start from <code>content.json</code>. Visitors can change them live, export the design, and a refresh brings the original defaults back.
        </div>

        <div className="editor-actions">
          <button type="button" className="editor-button" onClick={onReset}>Reset Defaults</button>
          <label className="editor-upload">
            Upload Photo
            <input
              type="file"
              accept="image/png,image/jpeg,image/jpg,image/webp"
              onChange={onPhotoUpload}
              style={{ display: 'none' }}
            />
          </label>
        </div>

        <div className="editor-section">
          <h3>Restaurant Photo</h3>
          <div className="editor-help">
            Replaces <code>assets/restro-photo.jpg</code> for this session only. PNG and JPG both work.
          </div>
          <div className="editor-file-note">
            Current image: {uploadedPhotoName || 'Default from content.json'}
          </div>
        </div>

        {fields.map((section) => (
          <div className="editor-section" key={section.title}>
            <h3>{section.title}</h3>
            {section.items.map(([label, path]) => (
              <EditorField
                key={path}
                label={label}
                value={readValue(path)}
                onChange={(value) => onChange(path, value)}
                multiline={path === 'contact.address'}
              />
            ))}
          </div>
        ))}
      </div>
    </aside>
  );
}

async function imageSourceToDataUrl(source) {
  const response = await fetch(source);
  const blob = await response.blob();

  return await new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onloadend = () => resolve(reader.result);
    reader.onerror = reject;
    reader.readAsDataURL(blob);
  });
}

function App() {
  const [content, setContent] = React.useState(DEFAULT_CONTENT);
  const [defaultContent, setDefaultContent] = React.useState(DEFAULT_CONTENT);
  const [photoSrc, setPhotoSrc] = React.useState(DEFAULT_CONTENT.assets.restaurantPhoto);
  const [defaultPhotoSrc, setDefaultPhotoSrc] = React.useState(DEFAULT_CONTENT.assets.restaurantPhoto);
  const [uploadedPhotoName, setUploadedPhotoName] = React.useState('');
  const [isPreparing, setIsPreparing] = React.useState(false);
  const frontCardRef = React.useRef(null);
  const backCardRef = React.useRef(null);

  React.useEffect(() => {
    document.title = DEFAULT_CONTENT.page.title;
    fetch('content.json')
      .then(r => r.json())
      .then(data => {
        setDefaultContent(data);
        setContent(data);
        setDefaultPhotoSrc(data.assets.restaurantPhoto);
        setPhotoSrc(data.assets.restaurantPhoto);
        document.title = data.page.title;
      })
      .catch(() => {
        setDefaultContent(DEFAULT_CONTENT);
        setContent(DEFAULT_CONTENT);
        setDefaultPhotoSrc(DEFAULT_CONTENT.assets.restaurantPhoto);
        setPhotoSrc(DEFAULT_CONTENT.assets.restaurantPhoto);
      });
  }, []);

  React.useEffect(() => {
    if (content?.page?.title) {
      document.title = content.page.title;
    }
  }, [content]);

  const handleFieldChange = React.useCallback((path, value) => {
    setContent((current) => setByPath(current, path, value));
  }, []);

  const handleReset = React.useCallback(() => {
    if (!defaultContent) return;
    setContent(defaultContent);
    setPhotoSrc(defaultPhotoSrc || defaultContent.assets.restaurantPhoto);
    setUploadedPhotoName('');
  }, [defaultContent, defaultPhotoSrc]);

  const handlePhotoUpload = React.useCallback((event) => {
    const file = event.target.files?.[0];
    if (!file) return;
    const objectUrl = URL.createObjectURL(file);
    setPhotoSrc((current) => {
      if (current && current.startsWith('blob:')) {
        URL.revokeObjectURL(current);
      }
      return objectUrl;
    });
    setUploadedPhotoName(file.name);
    event.target.value = '';
  }, []);

  React.useEffect(() => (
    () => {
      if (photoSrc && photoSrc.startsWith('blob:')) {
        URL.revokeObjectURL(photoSrc);
      }
    }
  ), [photoSrc]);

  const exportCardAsSVG = React.useCallback(async (element, filename) => {
    if (!element) return;
    setIsPreparing(true);
    try {
      await document.fonts?.ready;
      const clone = element.cloneNode(true);
      const imageNodes = Array.from(clone.querySelectorAll('img'));
      await Promise.all(imageNodes.map(async (img) => {
        const source = img.getAttribute('src');
        if (!source) return;
        img.setAttribute('src', await imageSourceToDataUrl(source));
      }));

      clone.setAttribute('xmlns', 'http://www.w3.org/1999/xhtml');
      const serializedMarkup = new XMLSerializer().serializeToString(clone);

      const svgMarkup = `<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="${PRINT_EXPORT.width}" height="${PRINT_EXPORT.height}" viewBox="0 0 ${PRINT_EXPORT.width} ${PRINT_EXPORT.height}">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800;900&amp;family=Open+Sans:wght@300;400;600&amp;display=swap');
      * { box-sizing: border-box; }
      body { margin: 0; }
    </style>
  </defs>
  <foreignObject width="100%" height="100%">
    ${serializedMarkup}
  </foreignObject>
</svg>`;

      const blob = new Blob([svgMarkup], { type: 'image/svg+xml;charset=utf-8' });
      const blobUrl = URL.createObjectURL(blob);
      const link = document.createElement('a');
      link.href = blobUrl;
      link.download = filename;
      document.body.appendChild(link);
      link.click();
      link.remove();
      URL.revokeObjectURL(blobUrl);
    } finally {
      setIsPreparing(false);
    }
  }, []);

  return (
    <div className="app-shell">
      <div className="canvas-pane">
        <DesignCanvas title={content.page.canvasTitle} style={{ width: '100%', height: '100%' }}>
          <DCSection id="s1" title="Visting Card Design">
            <DCArtboard id="front" label="Front" width={420} height={280}>
              <div style={{
                width:'100%', height:'100%',
                background:'#c8922a',
                borderRadius:8,
                display:'flex', alignItems:'center', justifyContent:'center',
              }}>
                <CardBack photoSrc={photoSrc} content={content} qrUrl={content.qr.url} cardRef={frontCardRef} />
              </div>
            </DCArtboard>
            <DCArtboard id="back" label="Back" width={420} height={280}>
              <div style={{
                width:'100%', height:'100%',
                background:'#c8922a',
                borderRadius:8,
                display:'flex', alignItems:'center', justifyContent:'center',
              }}>
                <CardFront content={content} cardRef={backCardRef} />
              </div>
            </DCArtboard>
          </DCSection>
        </DesignCanvas>
      </div>
      <EditorPanel
        content={content}
        onChange={handleFieldChange}
        onReset={handleReset}
        onPhotoUpload={handlePhotoUpload}
        uploadedPhotoName={uploadedPhotoName}
      />
      <OutputPanel
        isPreparing={isPreparing}
        onExportFront={() => exportCardAsSVG(frontCardRef.current, 'visiting-card-front.svg')}
        onExportBack={() => exportCardAsSVG(backCardRef.current, 'visiting-card-back.svg')}
      />
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
